name: Build iOS (MOBPOS Companion)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App & IPA
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Build Web Assets
        run: |
          cd mobile
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd mobile
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd mobile/ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p build-artifacts/Payload
          cp -r mobile/ios/App/build/Build/Products/Release-iphoneos/App.app build-artifacts/Payload/
          cd build-artifacts
          zip -r MOBPOS-Companion.ipa Payload
          ls -lh MOBPOS-Companion.ipa

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOBPOS-Companion-iOS-IPA
          path: build-artifacts/MOBPOS-Companion.ipa
          retention-days: 30

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.21 build-artifacts/MOBPOS-Companion.ipa --clobber || true
