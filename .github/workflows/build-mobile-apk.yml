name: Build Android APK (MOBPOS Companion)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Build Web Assets
        run: |
          cd mobile
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MOBPOS-Companion.apk
          ls -lh build-artifacts/MOBPOS-Companion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOBPOS-Companion-APK
          path: build-artifacts/MOBPOS-Companion.apk
          retention-days: 30

      - name: Upload to Latest Release if tagged
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG_NAME" build-artifacts/MOBPOS-Companion.apk --clobber || true
