name: Deploy Mobile PWA (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/deploy-mobile-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Build Web Assets for Pages
        run: |
          cd mobile
          npm run build -- --base=/MOBPOS-V2/

      - name: Add SPA fallback page
        run: |
          cp mobile/dist/index.html mobile/dist/404.html
          ls -lh mobile/dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
