name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Windows installer & publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve version (tag must match package.json)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag v$TAG does not match package.json version $VERSION"
              exit 1
            fi
          else
            TAG="$VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$TAG" >> "$GITHUB_ENV"

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build Windows installers (electron-builder)
        run: npx electron-builder --win --x64 --publish never

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f release/latest.yml ]; then
            echo "::error::release/latest.yml is missing — auto-update would break"
            exit 1
          fi
          ls -la release

      - name: Extract changelog entry
        shell: bash
        run: |
          set -euo pipefail
          awk -v ver="$APP_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            printf 'MOBPOS %s\n' "$APP_VERSION" > notes.md
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(release/*.exe release/latest.yml release/*.blockmap)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MOBPOS v$APP_VERSION" \
              --notes-file notes.md \
              "${ASSETS[@]}"
          fi
