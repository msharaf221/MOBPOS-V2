name: CI

# ⚠️ المكان الصحيح للملف ده هو:  .github/workflows/ci.yml
# محفوظ في ci/ لأن توكن GitHub في جلسات Arena ما لوش صلاحية `workflows`
# فمش قادر ينشئ ملفات تحت .github/workflows. فعّله بأمر واحد:
#     npm run setup:ci      ← بينسخ ci.yml و release.yml لمكانهم
# ثم اعمل commit + push بحسابك.
#
# بيشتغل على كل Pull Request وكل دفعة على main.
# الهدف: أي حاجة تكسر الأمان أو الأنواع أو الاختبارات تتمسك قبل الدمج،
# بدل ما ترجع في فحص الأمان الجاي.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# صلاحيات قراءة بس — الـ workflow ده مش بينشر حاجة.
permissions:
  contents: read

# لو اتدفع كوميت جديد على نفس الـ PR، الجري القديم يتلغي.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests & security config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # يفحص الكود نفسه (مش موقع منشور) — فمينفعش يقع بسبب الشبكة.
      # بيتأكد إن رؤوس الحماية وrobots/sitemap/privacy لسه مكانهم.
      - name: Verify security configuration
        run: npm run verify:security:config

      - name: Build
        run: npm run build

      # الملفات العامة لازم توصل مجلد dist، مش تفضل في public بس.
      - name: Verify public files reached the build output
        run: |
          set -euo pipefail
          missing=0
          for f in robots.txt sitemap.xml privacy.html index.html; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::dist/$f is missing from the build output"
              missing=1
            else
              echo "ok: dist/$f"
            fi
          done
          exit $missing

      # آخر خط دفاع: لو دومين وهمي رجع لأي ملف منشور، اكسر الـ build.
      # mobpos.app مش متسجّل، فأي إيميل عليه بيرجع bounce — والوعد بالرد
      # خلال 30 يوم على صندوق ميت مخالفة صريحة للقانون 151/2020.
      - name: Fail on placeholder contact details
        run: |
          set -euo pipefail
          # بندوّر في public/ بس — دي الملفات اللي بتتنشر وبيقراها المستخدم.
          # SECURITY.md مستثنى عن قصد لأن فيه أمثلة زي your-domain.com جوه
          # أوامر dig لشرح التحقق من DNSSEC، ودي مش بيانات تواصل.
          if grep -rniE "@mobpos\.app|0100-000-0000|your-?domain\.com" public/; then
            echo "::error::Placeholder contact details found in public/ — replace them with a working address"
            exit 1
          fi
          echo "ok: no placeholder contact details"
