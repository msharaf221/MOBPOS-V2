name: Release

# ⚠️ المكان الصحيح للملف ده هو:  .github/workflows/release.yml
# محفوظ في ci/ كنسخة احتياطية مطابقة.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Windows installers & publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve version (tag must match package.json)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag v$TAG does not match package.json version $VERSION"
              exit 1
            fi
          else
            TAG="$VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$TAG" >> "$GITHUB_ENV"

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build Windows 10/11 installers (electron-builder)
        run: npx electron-builder --win --x64 --publish never

      - name: Build Windows 7 installers (electron-builder with Electron 22)
        run: npx electron-builder --win --config electron-builder.win7.yml --publish never

      - name: Prepare direct download aliases
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-release

          # Windows 10/11 artifacts
          cp -f release/*.exe dist-release/
          cp -f release/latest.yml dist-release/
          cp -f release/*.blockmap dist-release/ 2>/dev/null || true

          # Create friendly aliases for direct downloads (latest link)
          SETUP_WIN10=(release/*Setup*.exe)
          PORTABLE_WIN10=(release/*Portable*.exe)
          if [ ${#SETUP_WIN10[@]} -gt 0 ]; then
            cp -f "${SETUP_WIN10[0]}" dist-release/MOBPOS-Setup-Win10-x64.exe
          fi
          if [ ${#PORTABLE_WIN10[@]} -gt 0 ]; then
            cp -f "${PORTABLE_WIN10[0]}" dist-release/MOBPOS-Portable-Win10-x64.exe
          fi

          # Windows 7 artifacts (ia32 + x64)
          cp -f release-win7/*.exe dist-release/

          SETUP_WIN7_IA32=(release-win7/*Setup*ia32.exe)
          SETUP_WIN7_X64=(release-win7/*Setup*x64.exe)
          PORTABLE_WIN7_IA32=(release-win7/*Portable*ia32.exe)
          PORTABLE_WIN7_X64=(release-win7/*Portable*x64.exe)

          if [ ${#SETUP_WIN7_IA32[@]} -gt 0 ]; then
            cp -f "${SETUP_WIN7_IA32[0]}" dist-release/MOBPOS-Setup-Win7-32bit.exe
          fi
          if [ ${#SETUP_WIN7_X64[@]} -gt 0 ]; then
            cp -f "${SETUP_WIN7_X64[0]}" dist-release/MOBPOS-Setup-Win7-64bit.exe
          fi
          if [ ${#PORTABLE_WIN7_IA32[@]} -gt 0 ]; then
            cp -f "${PORTABLE_WIN7_IA32[0]}" dist-release/MOBPOS-Portable-Win7-32bit.exe
          fi
          if [ ${#PORTABLE_WIN7_X64[@]} -gt 0 ]; then
            cp -f "${PORTABLE_WIN7_X64[0]}" dist-release/MOBPOS-Portable-Win7-64bit.exe
          fi

          echo "=== Ready artifacts to upload ==="
          ls -la dist-release

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f dist-release/latest.yml ]; then
            echo "::error::dist-release/latest.yml is missing — auto-update would break"
            exit 1
          fi

      - name: Extract changelog entry
        shell: bash
        run: |
          set -euo pipefail
          awk -v ver="$APP_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            printf 'MOBPOS %s\n' "$APP_VERSION" > notes.md
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(dist-release/*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MOBPOS v$APP_VERSION" \
              --notes-file notes.md \
              "${ASSETS[@]}"
          fi
